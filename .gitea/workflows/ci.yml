# Runs on Gitea Actions when the instance has a runner (act_runner); otherwise it is ignored.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests tools
      - name: Test
        run: pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t smtp-graph-relay:ci .
