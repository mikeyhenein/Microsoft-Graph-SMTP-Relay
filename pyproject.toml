[project]
name = "smtp-graph-relay"
version = "2.2.2"
description = "SMTP relay that sends mail through the Microsoft Graph API"
requires-python = ">=3.14"
license = "MIT"

[tool.pytest.ini_options]
pythonpath = ["app"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = [
    "S101",  # assert is fine in tests
    "S104",  # binding 0.0.0.0 is the point of a relay container
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"tools/**" = ["S105"]
