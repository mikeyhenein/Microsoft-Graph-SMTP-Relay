---

services:
  smtp-relay:
    build: .
    container_name: microsoft-graph-smtp-relay
    restart: unless-stopped
    # Secrets and settings live in .env (not committed); copy .env.sample to start.
    env_file: .env
    ports:
      # host:container. Devices that expect port 25 or 587: use "25:2525" or "587:2525".
      - "2525:2525"
      # Dashboard (only listens when DASHBOARD_USER and DASHBOARD_PASS are set)
      - "8025:8080"
    volumes:
      # TLS certificate, retry queue and optional log file
      - relay-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Ceilings so a flood cannot take the host down with it. With LARGE_MESSAGES=true raise mem_limit to 2g.
    mem_limit: 512m
    pids_limit: 200
    # Docker on Linux does not rotate container logs by default.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  relay-data:
