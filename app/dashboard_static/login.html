<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Relay sign in</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<main class="login">
  <div class="brand brand-lg">
    <span class="brand-mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6l9 -6"></path></svg>
    </span>
    <span class="brand-name">SMTP Graph Relay</span>
  </div>

  <form class="card login-card" method="post" action="/login">
    <div class="stack-sm">
      <h1 class="h1">Sign in</h1>
      <p class="muted">View relay activity, devices and the retry queue.</p>
    </div>
    <!--error-->
    <div class="field">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Sign in</button>
    <p class="muted small center">Sessions end after 8 hours of inactivity.</p>
  </form>

  <p class="faint small">smtp-graph-relay <!--version--></p>
</main>
</body>
</html>
